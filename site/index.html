<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FEBAUTO Racing</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #090b10; --bg-2: #0e1118; --panel: #12161f; --panel-2: #171c27; --panel-3: #1d2330;
    --line: rgba(255,255,255,.07); --line-2: rgba(255,255,255,.13);
    --ink: #eef1f6; --ink-2: #b4bcc9; --ink-3: #7f8898;
    --gold: #FDB515; --gold-2: #ffd166; --gold-dim: rgba(253,181,21,.16);
    --blue: #5b93ff; --blue-dim: rgba(91,147,255,.16); --navy: #1C4687;
    --ok: #3dd68c; --warn: #f5b942; --bad: #ff6b6b;
    --silver: #cfd6e2; --bronze: #d49a5a;
    --r: 18px; --r-s: 12px;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --shadow: 0 10px 30px rgba(0,0,0,.35), 0 1px 0 rgba(255,255,255,.04) inset;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; font: 15px/1.6 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased;
    background-image:
      radial-gradient(1100px 600px at 15% -20%, rgba(91,147,255,.16), transparent 60%),
      radial-gradient(800px 500px at 100% 0%, rgba(253,181,21,.10), transparent 55%),
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: auto, auto, 48px 48px, 48px 48px; background-attachment: fixed; }
  a { color: var(--blue); text-decoration: none; transition: color .15s; } a:hover { color: var(--gold-2); }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }

  header { position: sticky; top: 0; z-index: 20; backdrop-filter: blur(14px) saturate(140%); background: rgba(9,11,16,.72); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1160px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; color: var(--ink); font-weight: 800; letter-spacing: .06em; font-size: 16px; }
  .brand img { height: 28px; filter: drop-shadow(0 2px 8px rgba(253,181,21,.25)); }
  .brand small { font-weight: 500; color: var(--ink-3); font-size: 11px; letter-spacing: .22em; text-transform: uppercase; }
  nav { display: flex; gap: 2px; margin-left: auto; flex-wrap: wrap; }
  nav a { color: var(--ink-2); font-weight: 600; font-size: 13.5px; padding: 8px 13px; border-radius: 10px; position: relative; }
  nav a:hover { color: var(--ink); background: rgba(255,255,255,.05); }
  nav a.active { color: var(--gold-2); background: var(--gold-dim); }

  main { max-width: 1160px; margin: 0 auto; padding: 36px 24px 90px; animation: rise .35s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  section { margin: 0 0 56px; }
  .sec { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin: 0 0 18px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .sec h2 { font-size: 24px; margin: 0; letter-spacing: -.02em; font-weight: 800; }
  .sec .sub { color: var(--ink-3); font-size: 13.5px; margin-top: 4px; }
  h1 { font-size: clamp(30px, 4.2vw, 44px); margin: 0; letter-spacing: -.03em; line-height: 1.08; font-weight: 800; }
  h3 { font-size: 12px; margin: 30px 0 12px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .18em; font-weight: 700; display: flex; align-items: center; gap: 12px; }
  h3::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .lead { color: var(--ink-2); margin: 0 0 16px; max-width: 720px; font-size: 15.5px; }
  .muted { color: var(--ink-3); } .small { font-size: 13px; }
  .eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); margin: 0 0 10px; display: flex; align-items: center; gap: 10px; }
  .eyebrow::before { content: ""; width: 22px; height: 2px; background: var(--gold); border-radius: 2px; }

  .hero { position: relative; overflow: hidden; border-radius: 24px; border: 1px solid var(--line-2); background: linear-gradient(135deg, #141a26 0%, #0e1118 60%, #121622 100%); box-shadow: var(--shadow); padding: 40px 44px; margin-bottom: 48px; display: grid; grid-template-columns: 1.25fr .9fr; gap: 32px; align-items: center; }
  .hero::before { content: ""; position: absolute; inset: -1px; background: radial-gradient(600px 300px at 0% 0%, rgba(253,181,21,.12), transparent 60%); pointer-events: none; }
  .hero .art { position: absolute; right: -40px; top: -40px; width: 460px; opacity: .14; filter: grayscale(1) brightness(1.6); pointer-events: none; mask-image: linear-gradient(180deg, #000 20%, transparent 95%); -webkit-mask-image: linear-gradient(180deg, #000 20%, transparent 95%); }
  .hero .copy { position: relative; }
  .hero p.lead { margin-top: 16px; }
  .hero .cta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 14px; border: 1px solid var(--line-2); color: var(--ink); background: rgba(255,255,255,.04); transition: transform .12s, background .15s, border-color .15s; }
  .btn:hover { transform: translateY(-1px); background: rgba(255,255,255,.07); color: var(--ink); border-color: rgba(255,255,255,.2); }
  .btn.gold { background: var(--gold); color: #15110a; border-color: transparent; } .btn.gold:hover { background: var(--gold-2); color: #15110a; }
  .stats { position: relative; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .stat { background: rgba(255,255,255,.035); border: 1px solid var(--line); border-radius: var(--r-s); padding: 18px 20px; }
  .stat b { display: block; font-size: 32px; letter-spacing: -.03em; line-height: 1; font-family: var(--mono); font-weight: 700; }
  .stat span { color: var(--ink-3); font-size: 12.5px; letter-spacing: .04em; text-transform: uppercase; display: block; margin-top: 8px; }

  .seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 2px; }
  .seg a { padding: 7px 16px; border-radius: 9px; color: var(--ink-2); font-weight: 600; font-size: 13.5px; transition: background .15s, color .15s; }
  .seg a:hover { color: var(--ink); } .seg a.on { background: var(--gold); color: #15110a; box-shadow: 0 2px 10px rgba(253,181,21,.3); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 22px; }
  .chip { padding: 6px 13px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--ink-2); font-size: 13px; font-weight: 600; background: var(--panel); transition: all .15s; }
  .chip:hover { color: var(--ink); border-color: rgba(255,255,255,.25); } .chip.on { background: var(--blue); border-color: var(--blue); color: #fff; }

  .podium { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 16px; }
  .pod { background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px 16px; position: relative; overflow: hidden; box-shadow: var(--shadow); }
  .pod::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--c); }
  .pod.p1 { --c: var(--gold); } .pod.p2 { --c: var(--silver); } .pod.p3 { --c: var(--bronze); }
  .pod .rank { font-family: var(--mono); font-weight: 700; font-size: 13px; color: var(--c); letter-spacing: .1em; }
  .pod .name { font-size: 19px; font-weight: 800; margin: 6px 0 2px; display: flex; align-items: center; gap: 8px; }
  .pod .val { font-family: var(--mono); font-size: 30px; font-weight: 700; letter-spacing: -.03em; color: var(--ink); margin-top: 8px; }
  .pod .val small { font-size: 13px; color: var(--ink-3); font-family: Inter, sans-serif; font-weight: 500; letter-spacing: 0; margin-left: 6px; }
  .pod .sub { color: var(--ink-3); font-size: 12.5px; margin-top: 4px; }
  .pod.empty { border-style: dashed; color: var(--ink-3); display: grid; place-items: center; min-height: 128px; font-size: 13.5px; box-shadow: none; background: transparent; }
  .avatar { width: 28px; height: 28px; border-radius: 9px; display: inline-grid; place-items: center; font-size: 12px; font-weight: 800; color: #15110a; background: linear-gradient(135deg, var(--gold), #ff9f43); flex: none; }
  .avatar.b { background: linear-gradient(135deg, var(--blue), #7c5cff); color: #fff; }

  .wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); box-shadow: var(--shadow); scrollbar-color: var(--line-2) transparent; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 13px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
  th { background: rgba(255,255,255,.025); font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--ink-3); font-weight: 700; }
  tr:last-child td { border-bottom: 0; }
  tbody tr { transition: background .12s; } tbody tr:hover td { background: rgba(255,255,255,.03); }
  td.driver { font-weight: 600; } td.driver > * { vertical-align: middle; } td.driver .avatar { margin-right: 10px; } td.driver .tag { margin-left: 8px; }
  .num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .pos { width: 52px; font-family: var(--mono); font-weight: 700; color: var(--ink-3); }
  .pos i { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; font-style: normal; font-size: 12.5px; background: rgba(255,255,255,.05); }
  .pos.p1 i { background: var(--gold); color: #15110a; } .pos.p2 i { background: var(--silver); color: #15110a; } .pos.p3 i { background: var(--bronze); color: #15110a; }
  .score { font-weight: 700; color: var(--gold-2); font-size: 15px; }
  .bar-cell { min-width: 170px; }
  .meter { display: inline-block; vertical-align: middle; width: 120px; height: 7px; background: rgba(255,255,255,.07); border-radius: 4px; margin-right: 10px; overflow: hidden; }
  .meter i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--blue), var(--gold)); }
  .tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; vertical-align: middle; border: 1px solid transparent; letter-spacing: .02em; }
  .tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .tag.ok { background: rgba(61,214,140,.12); color: var(--ok); border-color: rgba(61,214,140,.3); }
  .tag.warn { background: rgba(245,185,66,.12); color: var(--warn); border-color: rgba(245,185,66,.3); }
  .tag.bad { background: rgba(255,107,107,.12); color: var(--bad); border-color: rgba(255,107,107,.3); }
  .tag.info { background: var(--blue-dim); color: #8fb4ff; border-color: rgba(91,147,255,.35); }
  .tag.gold { background: var(--gold-dim); color: var(--gold-2); border-color: rgba(253,181,21,.4); }
  .tag.plain::before { display: none; }
  code { background: rgba(255,255,255,.06); border: 1px solid var(--line); padding: 1px 7px; border-radius: 7px; font-size: 12.5px; color: var(--ink-2); font-family: var(--mono); }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 12px 16px; color: inherit; display: block; transition: transform .18s cubic-bezier(.2,.8,.2,1), border-color .18s, box-shadow .18s; box-shadow: var(--shadow); position: relative; }
  .card:hover { transform: translateY(-4px); border-color: rgba(253,181,21,.45); box-shadow: 0 18px 40px rgba(0,0,0,.45), 0 0 0 1px rgba(253,181,21,.2); color: inherit; }
  .card .pic { position: relative; aspect-ratio: 16/10; border-radius: 12px; background: #262626; overflow: hidden; margin-bottom: 14px; display: grid; place-items: center; }
  .card .pic img { width: 100%; height: 100%; object-fit: contain; padding: 8px; }
  .card .pic::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06), inset 0 -40px 40px -30px rgba(0,0,0,.6); border-radius: 12px; pointer-events: none; }
    .card .body { padding: 0 6px; }
  .card .title { font-weight: 700; font-size: 15.5px; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card .title .tag { font-size: 10px; padding: 1px 7px; }
  .card .meta { color: var(--ink-3); font-size: 12.5px; margin-top: 4px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .card .best { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-2); display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .card .best b { color: var(--gold-2); font-family: var(--mono); font-weight: 700; font-size: 14px; }
  .card .best .who { color: var(--ink-3); font-size: 12px; }
  .card.event { padding: 20px 22px; }
  .card.event .title { font-size: 17px; }
  .diff { display: inline-flex; gap: 3px; vertical-align: middle; }
  .diff i { width: 9px; height: 5px; border-radius: 2px; background: rgba(255,255,255,.12); } .diff i.on { background: var(--gold); }

  details.pace { margin-top: 12px; }
  details.pace summary { cursor: pointer; color: var(--ink-3); font-size: 13px; list-style: none; display: inline-flex; align-items: center; gap: 6px; } details.pace summary::-webkit-details-marker { display: none; }
  details.pace summary::before { content: "▸"; transition: transform .15s; } details.pace[open] summary::before { transform: rotate(90deg); }
  .pace-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; margin-top: 10px; }
  .pace { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font-size: 12.5px; display: flex; justify-content: space-between; gap: 8px; }
  .pace b { font-family: var(--mono); color: var(--gold-2); } .pace.off { opacity: .4; } .pace.off b { color: var(--ink-3); }

  .track-hero { display: grid; grid-template-columns: 440px 1fr; gap: 28px; align-items: start; margin-bottom: 32px; }
  .track-hero .pic { border-radius: var(--r); background: #262626; border: 1px solid var(--line-2); overflow: hidden; box-shadow: var(--shadow); }
  .track-hero .pic img { width: 100%; display: block; }
  .view3d { position: relative; aspect-ratio: 4/3; background: #202327; cursor: grab; }
  .view3d:active { cursor: grabbing; }
  .view3d canvas { display: block; width: 100%; height: 100%; }
  .view3d img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transition: opacity .4s; }
  .view3d.ready img { opacity: 0; pointer-events: none; }
  .view3d .hint { position: absolute; left: 10px; bottom: 10px; font-size: 11px; color: var(--ink-3); background: rgba(9,11,16,.7); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; letter-spacing: .04em; pointer-events: none; }
  .view3d .hint b { color: var(--gold-2); font-weight: 700; }
  .kv { display: grid; grid-template-columns: repeat(3, auto); gap: 14px; margin-top: 18px; }
  .kv div { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-s); padding: 12px 16px; }
  .kv > div > span { display: block; color: var(--ink-3); font-size: 11px; text-transform: uppercase; letter-spacing: .14em; margin-bottom: 4px; } .kv b { font-weight: 700; font-size: 15px; }
  .empty { border: 1px dashed var(--line-2); border-radius: var(--r); padding: 28px; text-align: center; color: var(--ink-3); }
  ol.steps { padding-left: 0; list-style: none; counter-reset: s; max-width: 760px; } ol.steps li { counter-increment: s; margin: 10px 0; padding: 14px 16px 14px 56px; position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-s); }
  ol.steps li::before { content: counter(s); position: absolute; left: 14px; top: 12px; width: 28px; height: 28px; border-radius: 9px; background: var(--gold); color: #15110a; display: grid; place-items: center; font-weight: 800; font-family: var(--mono); }
  footer { color: var(--ink-3); font-size: 12.5px; margin-top: 64px; border-top: 1px solid var(--line); padding-top: 18px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  @media (max-width: 820px) { .hero { grid-template-columns: 1fr; padding: 28px 24px; } .hero .art { display: none; } .track-hero { grid-template-columns: 1fr; } .podium { grid-template-columns: 1fr; } .kv { grid-template-columns: 1fr 1fr; } nav { margin-left: 0; } main { padding: 24px 16px 70px; } }
</style>
</head>
<body>
<header><div class="bar">
  <a class="brand" href="#/"><img src="logo.svg" alt="">FEBAUTO <small>Racing</small></a>
  <nav id="nav">
    <a href="#/">Leaderboards</a><a href="#/tracks">Tracks</a><a href="#/events">Competitions</a><a href="#/teams">Drivers</a><a href="#/docs">How to enter</a>
  </nav>
</div></header>
<main id="main"></main>
<script>
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const secs = (v) => v == null ? '—' : Number(v).toFixed(2);
const pct = (v) => v == null ? '—' : Number(v).toFixed(1) + '%';
const initials = (n) => esc(String(n || '?').split(/[\s_-]+/).map(w => w[0]).join('').slice(0, 2).toUpperCase());
const avatar = (n, i) => `<span class="avatar ${i % 2 ? 'b' : ''}">${initials(n)}</span>`;
const statusTag = (r) => r.status === 'finished' ? '' : `<span class="tag ${r.status === 'dnf' ? 'warn' : 'bad'}">${r.status.toUpperCase()}</span>`;
const verifiedTag = (r) => r.verified ? '<span class="tag ok">verified</span>' : '<span class="tag warn">unverified</span>';
const qualMark = (v) => v === 'verified' ? '<span class="tag ok plain">✓</span>' : v === 'unverified' ? '<span class="tag warn plain">~</span>' : '<span class="muted">–</span>';
const auditTag = (r) => Object.keys(r.restricted_subscribers || {}).length ? '<span class="tag bad" title="a node subscribed to a restricted topic">restricted topics</span>' : '';
const posCell = (i) => `<td class="pos p${i + 1}"><i>${i + 1}</i></td>`;
const diff = (n) => `<span class="diff" title="difficulty ${n || 0}/5">${[1,2,3,4,5].map(k => `<i class="${k <= (n || 0) ? 'on' : ''}"></i>`).join('')}</span>`;
const kindTag = (t) => `<span class="tag ${t.kind === 'cones' ? 'info' : 'ok'}">${t.kind}</span>`;
const groups = { feb: 'FEB tracks', feb_cones: 'FEB tracks · cones', fsae: 'Formula Student', roboracer: 'RoboRacer', f1: 'F1 circuits · 1:10', f1_cones: 'F1 circuits · 1:10 · cones' };
const groupOrder = Object.keys(groups);
const byDiff = (a, b) => (a.difficulty - b.difficulty) || (a.length - b.length);
const trackName = (d, id) => (d.tracks.find(t => t.id === id) || { name: id }).name;

function resultsTable(rows, showVerified) {
  if (!rows.length) return '<div class="empty">No results yet. Be the first: <code>./feb practice</code> then <code>./feb submit</code>.</div>';
  return `<div class="wrap"><table><thead><tr><th>#</th><th>Driver</th><th class="num">Total</th><th class="num">Best lap</th><th class="num">Laps</th><th class="num">Collisions</th><th>Run</th></tr></thead><tbody>` +
    rows.map((r, i) => `<tr>${posCell(i)}<td class="driver">${avatar(r.team, i)}${esc(r.team)}${showVerified ? verifiedTag(r) : ''}${statusTag(r)}${auditTag(r)}</td>
      <td class="num">${secs(r.total_s)} s</td><td class="num">${secs(r.best_lap_s)} s</td><td class="num">${r.laps_completed ?? r.lap_times.length}</td>
      <td class="num">${r.collisions}</td><td class="muted small">${esc(r.started_at.slice(0, 10))} <code>${esc(r.id)}</code></td></tr>`).join('') + '</tbody></table></div>';
}

const meanPace = (r) => { const v = Object.values(r.pace); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : 0; };
function podium(o) {
  return `<div class="podium">${[0, 1, 2].map(i => { const r = o.standings[i]; return r ? `<div class="pod p${i + 1}"><div class="rank">P${i + 1}</div><div class="name">${avatar(r.team, i)}${esc(r.team)}${verifiedTag(r)}</div>
      <div class="val">${pct(r.score)}<small>${r.finished} / ${r.of} tracks</small></div><div class="sub">mean pace on finished tracks ${pct(meanPace(r))}</div></div>`
    : `<div class="pod empty">P${i + 1} · open</div>`; }).join('')}</div>`;
}

function generalTable(d, o) {
  if (!o.standings.length) return '<div class="empty">No finished runs on any track of this kind yet.</div>';
  return podium(o) + `<div class="wrap"><table><thead><tr><th>#</th><th>Driver</th><th class="num">Score</th><th class="bar-cell">Tracks finished</th><th class="num">Mean pace on finished</th></tr></thead><tbody>` +
    o.standings.map((r, i) => `<tr>${posCell(i)}<td class="driver">${avatar(r.team, i)}${esc(r.team)}${verifiedTag(r)}</td><td class="num score">${pct(r.score)}</td>
      <td class="bar-cell"><span class="meter"><i style="width:${100 * r.finished / r.of}%"></i></span><span class="mono">${r.finished} / ${r.of}</span></td><td class="num">${pct(meanPace(r))}</td></tr>`).join('') + '</tbody></table></div>' +
    `<details class="pace"><summary>Pace per track</summary>${o.standings.map(r => `<div class="small" style="margin-top:12px"><b>${esc(r.team)}</b><div class="pace-grid">${o.tracks.map(t => `<div class="pace ${r.pace[t] == null ? 'off' : ''}"><span>${esc(trackName(d, t))}</span><b>${r.pace[t] == null ? '—' : pct(r.pace[t])}</b></div>`).join('')}</div></div>`).join('')}</details>`;
}

function trackCard(t, featured) {
  const best = t.standings.find(r => r.status === 'finished');
  return `<a class="card" href="#/tracks/${esc(t.id)}"><div class="pic">${t.preview ? `<img src="tracks/${esc(t.id)}.png" alt="" loading="lazy">` : ''}</div>
    <div class="body"><div class="title"><span>${esc(t.name)}</span>${kindTag(t)}${featured ? '<span class="tag gold">featured</span>' : ''}</div>
    <div class="meta"><span class="mono">${t.length} m</span><span>${esc(t.direction)}</span>${diff(t.difficulty)}<span>${t.attempts} attempt${t.attempts === 1 ? '' : 's'}</span></div>
    <div class="best">${best ? `<span><b>${secs(best.total_s)} s</b> <span class="who">· lap ${secs(best.best_lap_s)} s</span></span><span class="who">${esc(best.team)}</span>` : '<span class="who">No finished run yet</span><span class="who">be first</span>'}</div></div></a>`;
}

function eventCard(e) {
  return `<a class="card event" href="#/events/${esc(e.id)}"><div class="title">${esc(e.title)}</div>
    <div class="meta"><span class="mono">${esc(e.date)}</span><span>${esc(e.mode)}</span><span>${esc(e.track)}</span></div>
    <div class="best"><span class="tag ${e.status === 'done' ? 'ok' : e.status === 'live' ? 'bad' : 'info'}">${esc(e.status)}</span><span class="who">${e.attempts ? e.attempts + ' attempts' : ''}</span></div></a>`;
}

function races(e) {
  if (!e.races || !e.races.length) return '';
  return '<h3>Races</h3><div class="wrap"><table><thead><tr><th>Race</th><th>Driver</th><th class="num">Pos</th><th class="num">Laps</th><th class="num">Finish</th><th class="num">Collisions</th></tr></thead><tbody>' +
    e.races.map(id => e.results.filter(r => r.race === id).sort((a, b) => a.position - b.position).map(r =>
      `<tr><td class="mono">${esc(id)}</td><td>${esc(r.team)}${statusTag(r)}</td><td class="num">${r.position}</td><td class="num">${r.laps_completed}</td><td class="num">${secs(r.finish_s)}</td><td class="num">${r.collisions}</td></tr>`).join('')).join('') + '</tbody></table></div>';
}

const pages = {
  '/': (d, _, q) => {
    const kind = q.kind || 'walls'; const o = (d.overall || []).find(o => o.kind === kind) || { standings: [], tracks: [], featured: [] };
    const featured = d.tracks.filter(t => t.qualifying).sort(byDiff);
    const runs = d.tracks.reduce((a, t) => a + t.attempts, 0);
    const drivers = new Set(d.tracks.flatMap(t => t.standings.map(r => r.team))).size;
    const art = d.tracks.find(t => t.id === 'spa' && t.preview) || d.tracks.find(t => t.preview);
    return `
    <div class="hero">${art ? `<img class="art" src="tracks/${esc(art.id)}.png" alt="">` : ''}
      <div class="copy"><p class="eyebrow">Formula Electric at Berkeley · Autonomous</p><h1>Autonomous racing,<br>1/10 scale, full send.</h1>
        <p class="lead">Two disciplines in the FEB simulator. <b>Walls</b> is RoboRacer and F1TENTH style. <b>Cones</b> is Formula Student Driverless style: blue and yellow cones, no walls, build your own map. Every track has its own board. The general boards rank drivers across all of them.</p>
        <div class="cta"><a class="btn gold" href="#/docs">How to enter</a><a class="btn" href="#/tracks">Browse tracks</a><a class="btn" href="https://github.com/FEBAutonomous/feb-racing">GitHub</a></div></div>
      <div class="stats"><div class="stat"><b>${d.tracks.length}</b><span>tracks</span></div><div class="stat"><b>${runs}</b><span>runs posted</span></div><div class="stat"><b>${drivers}</b><span>drivers ranked</span></div><div class="stat"><b>${d.events.length}</b><span>competitions</span></div></div>
    </div>
    <section><div class="sec"><div><h2>General leaderboard</h2><div class="sub">Score is the mean pace over every ${esc(kind)} track. Pace is the fastest posted total divided by yours, so 100% holds the best run; tracks not finished count 0%.</div></div>
      <div class="seg">${(d.overall || []).map(x => `<a class="${x.kind === kind ? 'on' : ''}" href="#/?kind=${x.kind}">${esc(x.name)} <span class="mono" style="opacity:.7">${x.tracks.length}</span></a>`).join('')}</div></div>
      ${generalTable(d, o)}</section>
    <section><div class="sec"><div><h2>Featured tracks</h2><div class="sub">The qualification set: ${d.qualify.laps} laps, ${d.qualify.max_collisions === 0 ? 'no collisions' : 'at most ' + d.qualify.max_collisions + ' collision'} on each to qualify.</div></div><a class="btn" href="#/tracks">All ${d.tracks.length} tracks</a></div>
      <div class="cards">${featured.map(t => trackCard(t, true)).join('')}</div></section>
    <section><div class="sec"><div><h2>Competitions</h2><div class="sub">Secret tracks, verified runs, best attempt counts.</div></div><a class="btn" href="#/events">Details</a></div>
      <div class="cards">${d.events.map(eventCard).join('') || '<div class="empty">No events scheduled.</div>'}</div></section>`;
  },
  '/tracks': (d, _, q) => {
    const f = q.f || 'all';
    const show = (t) => f === 'all' || f === t.kind || f === (t.category || 'feb');
    const featured = d.tracks.filter(t => t.qualifying && show(t)).sort(byDiff);
    const chips = [['all', 'All'], ['walls', 'Walls'], ['cones', 'Cones'], ...groupOrder.filter(g => d.tracks.some(t => (t.category || 'feb') === g)).map(g => [g, groups[g]])];
    return `<div class="sec"><div><h2>Tracks</h2><div class="sub">${d.tracks.length} tracks, each with its own leaderboard. Run one with <code>./feb practice --driver NAME --track ID</code>, or <code>--track all</code> for the lot.</div></div></div>
      <div class="chips">${chips.map(([k, n]) => `<a class="chip ${f === k ? 'on' : ''}" href="#/tracks?f=${k}">${esc(n)}</a>`).join('')}</div>
      ${featured.length ? `<h3>Featured · qualification set</h3><div class="cards">${featured.map(t => trackCard(t, true)).join('')}</div>` : ''}
      ${groupOrder.map(g => { const ts = d.tracks.filter(t => !t.qualifying && (t.category || 'feb') === g && show(t)).sort(byDiff);
        return ts.length ? `<h3>${esc(groups[g])}</h3><div class="cards">${ts.map(t => trackCard(t, false)).join('')}</div>` : ''; }).join('')}`;
  },
  '/tracks/:id': (d, id) => { const t = d.tracks.find(t => t.id === id); if (!t) return '<div class="empty">Unknown track</div>';
    return `<p class="eyebrow"><a href="#/tracks">Tracks</a> &nbsp;/&nbsp; ${esc(groups[t.category || 'feb'] || t.category)}</p>
      <div class="track-hero"><div class="pic view3d" id="view3d" data-track="tracks/${esc(t.id)}.json">${t.preview ? `<img src="tracks/${esc(t.id)}.png" alt="">` : ''}<span class="hint"><b>3D</b> · drag to orbit · scroll to zoom</span></div>
        <div><h1>${esc(t.name)}</h1><div style="margin-top:10px">${kindTag(t)} ${t.qualifying ? '<span class="tag gold">featured</span>' : ''}</div>
          <div class="kv"><div><span>Length</span><b class="mono">${t.length} m</b></div><div><span>Direction</span><b>${esc(t.direction)}</b></div><div><span>Difficulty</span><b>${diff(t.difficulty)}</b></div><div><span>Walls</span><b>${t.walls ? 'yes' : 'no'}</b></div><div><span>Cones</span><b>${t.cones ? 'yes' : 'no'}</b></div><div><span>Attempts</span><b class="mono">${t.attempts}</b></div></div>
          <p class="small muted" style="margin-top:16px">Run it: <code>./feb practice --driver NAME --track ${esc(t.id)}</code>. Best attempt per driver. Verified results are reruns on the organiser's PC.</p></div></div>
      <div class="sec"><h2>Leaderboard</h2></div>${resultsTable(t.standings, true)}`; },
  '/practice': (d) => pages['/tracks'](d, '', {}),
  '/practice/:id': (d, id) => pages['/tracks/:id'](d, id),
  '/events': (d) => `<div class="sec"><div><h2>Competitions</h2><div class="sub">Official runs on the organiser's PC. Best attempt counts.</div></div></div>${d.events.map(e => `<section><h3 style="margin-top:0"><a href="#/events/${esc(e.id)}">${esc(e.title)}</a> <span class="tag info">${esc(e.status)}</span></h3><div class="muted small" style="margin:-4px 0 12px">${esc(e.date)} · ${esc(e.mode)} · track ${esc(e.track)} · ${e.attempts} attempts</div>${resultsTable(e.standings, false)}</section>`).join('') || '<div class="empty">No events yet.</div>'}`,
  '/events/:id': (d, id) => { const e = d.events.find(e => e.id === id); if (!e) return '<div class="empty">Unknown event</div>';
    const r = e.rules || {};
    return `<p class="eyebrow"><a href="#/events">Competitions</a></p><h1>${esc(e.title)}</h1><div style="margin:10px 0 6px"><span class="tag info">${esc(e.status)}</span></div><p class="lead">${esc(e.date)} · ${esc(e.mode)} · track ${esc(e.track)} · ${e.attempts ?? 1} attempt(s) per driver, best counts.<br>
      <span class="small muted">Rules: ${r.warmup_laps ?? 1} warm-up + ${r.laps ?? 10} timed laps, +${r.collision_penalty_s ?? 10} s per collision, DSQ above ${r.max_collisions ?? 10} collisions, ${r.timeout_s ?? 300} s limit.</span></p>${resultsTable(e.standings, false)}${races(e)}`; },
  '/teams': (d) => `<div class="sec"><div><h2>Drivers</h2><div class="sub">Qualification: on every featured track, a verified run of ${d.qualify.laps} laps with ${d.qualify.max_collisions === 0 ? 'no collisions' : 'at most ' + d.qualify.max_collisions + ' collision'}. <span class="tag ok plain">✓</span> verified &nbsp; <span class="tag warn plain">~</span> self-reported, awaiting the nightly rerun &nbsp; – not yet.</div></div></div>
    <div class="wrap"><table><thead><tr><th>Driver</th><th>Members</th>${d.tracks.filter(t => t.qualifying).map(t => `<th>${esc(t.name)}</th>`).join('')}<th>Image</th></tr></thead><tbody>${d.teams.map((t, i) => `<tr><td class="driver">${avatar(t.name, i)}${esc(t.name)}${t.qualified ? '<span class="tag ok">qualified</span>' : ''}</td><td>${(t.members || []).map(esc).join(', ')}</td>${d.tracks.filter(t => t.qualifying).map(tr => `<td>${qualMark((t.qualification || {})[tr.id])}</td>`).join('')}<td><code>${esc(t.image)}</code></td></tr>`).join('')}</tbody></table></div>`,
  '/docs': (d) => `<div class="sec"><div><h2>How to enter</h2><div class="sub">From zero to a posted lap time.</div></div></div>
    <ol class="steps">
      <li>Clone the repo, run <code>./feb setup</code>, then <code>./feb up</code> to drive manually.</li>
      <li>Start a driver from the starter kit: <code>./feb new my_driver</code> (add <code>--from feb_cone_driver</code> for cones) and make it drive: <code>./feb up --driver my_driver</code>.</li>
      <li>Score yourself: <code>./feb practice --driver my_driver</code> runs every featured track of its kind (<code>--track all</code> for every track). Post the finished ones: <code>./feb submit</code>.</li>
      <li>Build and push your image (<code>docker build</code> from the FEB devkit), add your team to <code>submissions.yaml</code>. Nightly reruns and competitions use that image.</li>
      <li>Qualify: ${d.qualify.laps} laps with no collisions on <em>every</em> featured track, verified by the nightly rerun (the Drivers page shows your progress). Qualified drivers race the qualification time-attack; its top seeds go to the head-to-head final, two cars at a time.</li>
    </ol>
    <p>Full guide: <a href="https://github.com/FEBAutonomous/feb-racing/blob/main/docs/handbook.md">docs/handbook.md</a> in the repo.</p>
    <p class="small muted">Rules follow the RoboRacer Sim Racing League: ground-truth topics (<code>ips</code>, <code>odom</code>, <code>tf</code>, lap/collision counters, <code>reset_command</code>) are for training and debugging only, never at race time; 10 s per collision.</p>`,
};

let cache;
async function render() {
  cache = cache || await (await fetch('data.json', { cache: 'no-store' })).json(); const d = cache;
  const [path, qs] = (location.hash.slice(1) || '/').split('?');
  const q = Object.fromEntries(new URLSearchParams(qs || ''));
  const [, section, id] = path.split('/');
  const nav = '#' + (section ? `/${section}` : '/');
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('active', a.getAttribute('href') === nav || (nav === '#/practice' && a.getAttribute('href') === '#/tracks')));
  const key = id ? `/${section}/:id` : `/${section || ''}`;
  const page = pages[key] || pages['/'];
  const main = document.getElementById('main');
  main.innerHTML = page(d, decodeURIComponent(id || ''), q) + `<footer><span>Formula Electric at Berkeley · built on the AutoDRIVE Ecosystem</span><span class="mono">generated ${esc(d.generated)}</span></footer>`;
  main.style.animation = 'none'; void main.offsetWidth; main.style.animation = '';
  window.scrollTo(0, 0);
  if (viewer) { viewer.dispose(); viewer = null; }
  const box = document.getElementById('view3d');
  if (box) mountTrack3D(box).then(v => { viewer = v; }).catch(e => console.warn('3D viewer unavailable', e));
}

// ---- 3D track viewer: a cosmetic model built from track.json (surface, walls or cones), Three.js from a CDN ----
let viewer = null, THREE_P = null;
async function mountTrack3D(box) {
  THREE_P = THREE_P || import('https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js');
  const [THREE, t] = await Promise.all([THREE_P, fetch(box.dataset.track).then(r => r.json())]);
  if (!box.isConnected) return null;
  const pairs = (flat) => { const out = []; for (let i = 0; i + 1 < flat.length; i += 2) out.push([flat[i], flat[i + 1]]); return out; };
  const L = pairs(t.paint_left || []), R = pairs(t.paint_right || []), C = pairs(t.centreline || []);
  const all = [...L, ...R, ...C, ...(t.cones || []).map(c => [c.x, c.y]), ...(t.walls || []).flatMap(w => pairs(w.points))];
  if (!all.length) return null;
  let minx = Infinity, maxx = -Infinity, miny = Infinity, maxy = -Infinity;
  for (const [x, y] of all) { minx = Math.min(minx, x); maxx = Math.max(maxx, x); miny = Math.min(miny, y); maxy = Math.max(maxy, y); }
  const cx = (minx + maxx) / 2, cy = (miny + maxy) / 2, span = Math.max(maxx - minx, maxy - miny);
  const V = (x, y, z = 0) => new THREE.Vector3(x - cx, z, -(y - cy));   // track x,y (y up on the map) -> three x, -z; height on y

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x202327);
  scene.fog = new THREE.Fog(0x202327, span * 1.6, span * 4);
  scene.add(new THREE.HemisphereLight(0xdfe7ff, 0x202327, 1.1));
  const sun = new THREE.DirectionalLight(0xffffff, 1.4); sun.position.set(span, span * 1.2, span * .6); scene.add(sun);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(span * 8, span * 8), new THREE.MeshStandardMaterial({ color: 0x262a30, roughness: 1 }));
  ground.rotation.x = -Math.PI / 2; ground.position.y = -0.02; scene.add(ground);
  const grid = new THREE.GridHelper(span * 8, Math.round(span * 8 / Math.max(1, Math.round(span / 20))), 0x343a44, 0x2c3139); grid.position.y = -0.01; scene.add(grid);

  // the painted surface: the centreline swept sideways. The paint lists are dash endpoints, not
  // clean loops, so the half-width on each side is measured as the distance from each centreline
  // sample to the nearest paint point on that side.
  const thin = (poly, cap) => { const step = Math.max(1, Math.ceil(poly.length / cap)); return poly.filter((_, i) => i % step === 0); };
  const Cs = thin(C, 1200);
  if (Cs.length > 2) {
    const near = (pts) => (x, y) => { let b = Infinity; for (const [px, py] of pts) { const d = (px - x) ** 2 + (py - y) ** 2; if (d < b) b = d; } return Math.sqrt(b); };
    const nL = near(thin(L, 1500)), nR = near(thin(R, 1500)), n = Cs.length;
    const fallback = 1.0;
    const pos = [], idx = [], edgeL = [], edgeR = [];
    for (let i = 0; i < n; i++) {
      const [x, y] = Cs[i], [xp, yp] = Cs[(i - 1 + n) % n], [xn, yn] = Cs[(i + 1) % n];
      let tx = xn - xp, ty = yn - yp; const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
      const nx = -ty, ny = tx;   // left normal
      const wl = L.length ? Math.min(6, nL(x, y)) : fallback, wr = R.length ? Math.min(6, nR(x, y)) : fallback;
      // which paint list is actually on the left depends on the track's direction: test once
      const a = V(x + nx * wl, y + ny * wl, .005), b = V(x - nx * wr, y - ny * wr, .005);
      pos.push(a.x, a.y, a.z, b.x, b.y, b.z); edgeL.push(a); edgeR.push(b);
    }
    for (let i = 0; i < n; i++) { const j = (i + 1) % n, a = 2 * i, b = 2 * i + 1, c = 2 * j, d = 2 * j + 1; idx.push(a, b, c, b, d, c); }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx);
    g.setAttribute('normal', new THREE.Float32BufferAttribute(new Array(pos.length / 3).fill([0, 1, 0]).flat(), 3));   // flat: every vertex faces up
    scene.add(new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0xd9dbdf, roughness: .95, side: THREE.DoubleSide })));
    for (const edge of [edgeL, edgeR]) scene.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(edge.map(v => v.clone().setY(.012))), new THREE.LineBasicMaterial({ color: 0xffffff })));
  }
  if (C.length > 2) scene.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(C.map(([x, y]) => V(x, y, .015))), new THREE.LineBasicMaterial({ color: 0xf2a900, transparent: true, opacity: .8 })));

  // walls: round foam tubes along each polyline
  const wallR = (t.wall_diameter || .33) / 2;
  for (const w of t.walls || []) {
    const pts = pairs(w.points).map(([x, y]) => V(x, y, wallR));
    if (pts.length < 3) continue;
    const curve = new THREE.CatmullRomCurve3(pts, true, 'centripetal');
    scene.add(new THREE.Mesh(new THREE.TubeGeometry(curve, Math.max(64, pts.length * 6), wallR, 12, true), new THREE.MeshStandardMaterial({ color: 0x1c4687, roughness: .6 })));
  }
  // cones
  const cones = t.cones || [];
  if (cones.length) {
    const colours = { blue: 0x1e56d6, yellow: 0xf2c200, orange: 0xff6a00 };
    const geo = new THREE.ConeGeometry(.11, .32, 14), base = new THREE.CylinderGeometry(.15, .15, .02, 14);
    for (const c of cones) { const col = colours[c.color] || 0xff6a00;
      const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: col, roughness: .5 })); m.position.copy(V(c.x, c.y, .16)); scene.add(m);
      const b = new THREE.Mesh(base, new THREE.MeshStandardMaterial({ color: 0x111111, roughness: .9 })); b.position.copy(V(c.x, c.y, .01)); scene.add(b); }
  }
  // start marker
  if (t.spawn) { const m = new THREE.Mesh(new THREE.SphereGeometry(.14, 16, 12), new THREE.MeshStandardMaterial({ color: 0x3dd68c, emissive: 0x0f6b3f })); m.position.copy(V(t.spawn.x, t.spawn.y, .16)); scene.add(m); }

  // camera, renderer, a small orbit control (drag to rotate, wheel to zoom, slow auto-spin until touched)
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  box.appendChild(renderer.domElement);
  const camera = new THREE.PerspectiveCamera(42, 4 / 3, .05, span * 10);
  let theta = Math.PI * .25, phi = .95, dist = span * 1.45, auto = true, drag = null;
  const place = () => { camera.position.set(dist * Math.cos(phi) * Math.sin(theta), dist * Math.sin(phi), dist * Math.cos(phi) * Math.cos(theta)); camera.lookAt(0, 0, 0); };
  const down = (e) => { auto = false; drag = { x: e.clientX, y: e.clientY }; box.setPointerCapture(e.pointerId); };
  const move = (e) => { if (!drag) return; theta -= (e.clientX - drag.x) * .006; phi = Math.min(1.5, Math.max(.12, phi + (e.clientY - drag.y) * .006)); drag = { x: e.clientX, y: e.clientY }; };
  const up = () => { drag = null; };
  const wheel = (e) => { e.preventDefault(); dist = Math.min(span * 4, Math.max(span * .15, dist * Math.exp(e.deltaY * .0012))); };
  box.addEventListener('pointerdown', down); box.addEventListener('pointermove', move); box.addEventListener('pointerup', up); box.addEventListener('pointercancel', up); box.addEventListener('wheel', wheel, { passive: false });
  const size = () => { const w = box.clientWidth, h = box.clientHeight; if (w && h) { renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); place(); renderer.render(scene, camera); } };
  const ro = new ResizeObserver(size); ro.observe(box); size();
  let raf = 0, last = performance.now();
  const loop = (now) => { if (auto) theta += (now - last) * .00012; last = now; place(); renderer.render(scene, camera); raf = requestAnimationFrame(loop); };
  raf = requestAnimationFrame(loop);
  box.classList.add('ready');
  return { dispose() { cancelAnimationFrame(raf); ro.disconnect(); renderer.dispose(); scene.traverse(o => { o.geometry?.dispose?.(); o.material?.dispose?.(); }); renderer.domElement.remove(); } };
}
addEventListener('hashchange', render);
render();
</script>
