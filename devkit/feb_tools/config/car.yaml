# The real car. VESC values are the RoboRacer guide's for the Velineon 3500 (f1tenth_system,
# config/vesc.yaml); the wheelbase is ours. Re-measure speed_to_erpm_gain after the first drive.
/**:
  ros__parameters:
    # erpm = speed_to_erpm_gain * speed (m/s) + speed_to_erpm_offset
    speed_to_erpm_gain: 4614.0
    speed_to_erpm_offset: 0.0
    # servo (0..1) = steering_angle_to_servo_gain * angle (rad) + steering_angle_to_servo_offset
    steering_angle_to_servo_gain: -1.2135
    steering_angle_to_servo_offset: 0.5304
    port: /dev/sensors/vesc
    duty_cycle_min: 0.0
    duty_cycle_max: 0.0
    current_min: 0.0
    current_max: 100.0
    brake_min: -20000.0
    brake_max: 200000.0
    speed_min: -23250.0
    speed_max: 23250.0
    position_min: 0.0
    position_max: 0.0
    servo_min: 0.15
    servo_max: 0.85

vesc_to_odom_node:
  ros__parameters:
    odom_frame: odom
    base_frame: base_link
    publish_tf: true
    use_servo_cmd_to_calc_angular_velocity: true
    wheelbase: 0.324

rplidar_node:
  ros__parameters:
    serial_port: /dev/sensors/rplidar
    serial_baudrate: 1000000       # the S2
    frame_id: laser
    inverted: false
    angle_compensate: true
    scan_mode: DenseBoost

joy:
  ros__parameters:
    device_id: 0
    deadzone: 0.05
    autorepeat_rate: 20.0
    coalesce_interval: 0.01

scan_rotate:
  ros__parameters:
    lidar_yaw: 1.5708              # the S2 sits turned 90 deg (cable out the side); car angle = lidar angle + this. Hand test: a hand in front of the nose reads 0.

supervisor:
  ros__parameters:
    scan_timeout: 0.5              # s without a scan before STOP: the car's rule (the simulator launch allows 2 s)
    # the 8BitDo Ultimate 2C through its 2.4 GHz dongle as the kernel's xpad driver sees it (usb 2dc8:301c),
    # measured 2026-10-19: LB 6, RB 7, minus 10; left stick up/down axis 1, right stick left/right axis 2.
    # In its other mode (usb 2dc8:310a) it is LB 4, RB 5, Back 6, steer axis 3: do not press the X/B/A+Home combos.
    manual_button: 6
    auto_button: 7
    stop_button: 10
    speed_axis: 1
    steer_axis: 2
    # the car's guards (2026-10-29, after a 20% pack was driven flat and browned the Jetson out)
    battery_floor: 11.6            # V resting (the gauge's estimate): below it the car stays IDLE and says "charge it"
    battery_cut: 10.0              # V measured under load while driving: STOP, the pack is collapsing
    stall_current: 20.0            # A motor current with the wheels stopped for stall_time: throttle cut
    stall_time: 0.5                # s
    stall_release: 1.0             # s of zero throttle after a stall
    speed_ceiling: 3.0             # m/s, the car's own cap; the driver card's cap applies under it

battery:
  ros__parameters:
    cells: 3                       # Zeee 3S 6000 mAh LiPo
    capacity_ah: 6.0
    pack_resistance: 0.05          # ohm; undoes the sag under load before reading the charge table
    baseline_current: 1.5          # A the Jetson, lidar and servo draw through the power board, unseen by the VESC
    recharge_soc: 0.2              # "time to recharge" counts down to this
    stop_cell_voltage: 3.5         # 10.5 V: stop driving
