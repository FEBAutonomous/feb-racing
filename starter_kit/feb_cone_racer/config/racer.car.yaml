# Loaded on top of racer.yaml only on the car (FEB_CAR=1). The RealSense D435if on the front bumper,
# fitted 2026-11-04 from the first car bag (same camera and mount as feb_cone_driver's car file), plus
# the outdoor tune from the same evening and first-drive speeds. The supervisor's cap applies on top.
racer:
  ros__parameters:
    camera_hfov_deg: 54.8    # bag fit 2026-11-08 (uab_racer_0028, 3146 pairs, 4.8 px): matches camera_info's 55.6
    camera_ahead: 0.14    # m, bag fit 2026-11-08
    camera_lateral: 0.032    # m, bag fit 2026-11-08
    camera_col_bias: 26.4    # px, bag fit 2026-11-08
    camera_lag_s: 0.01    # s, bag fit 2026-11-08 with the gyro in rad/s (0.10 was fitted against deg/s)
    band_top: 0.55    # bag fit 2026-11-08: cone tops at rows 278-356 of 480
    band_bottom: 0.89    # bag fit 2026-11-08
    band_floor: 0.62    # bag fit 2026-11-08: no cone bottom above row 296
    hsv_blue: [92, 110, 40, 115, 255, 255]
    hsv_yellow: [18, 90, 60, 38, 255, 255]
    hsv_orange: [0, 100, 60, 15, 255, 255]
    min_blob_px: 60
    orange_min_px: 120
    max_range: 4.0            # outdoor clutter at range is not cones
    side_guess_range: 2.0     # a near cone the camera gave no colour takes the side it sits on (as in the sim);
                              # 0.0 ignored such cones, which left holes whenever the colour missed indoors (2026-11-08)
